  <!--bagian E-->
  <form name="formPendaftaran" onsubmit="return validateForm();">
    Nama: <input type="text" name="nama" /><br />
    Email: <input type="email" name="email" /><br />
    <input type="submit" value="Sign In" />
  </form>

  <!--bagian F-->
  <form id="emailForm">
    <h2>Form Email</h2>
    <input type="email" id="email" placeholder="Email" />
    <div id="emailError" style="color: red"></div>
    <button type="submit">Kirim</button>
  </form>

  <script>
    document
      .getElementById("emailForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        const err = document.getElementById("emailError");
        err.textContent = "";
        const email = document.getElementById("email").value.trim();
        const pola = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === "") {
          err.textContent = "Email tidak boleh kosong.";
        } else if (!pola.test(email)) {
          err.textContent = "Format email tidak valid.";
        } else {
          alert("Email berhasil dikirim!");
          this.reset();
        }
      });
  </script>

  <!--Bagian H-->
  <form name="registrationForm" onsubmit="return validateRegistrationForm();">
    Email: <input type="text" name="email" /><br />
    Kata Sandi: <input type="password" name="password" /><br />
    <input type="submit" value="Daftar" />
  </form>
  <script>
    function validateRegistrationForm() {
      let f = document.forms["registrationForm"];
      let email = f["email"].value;
      let password = f["password"].value;
      if (email == "" || email.indexOf("@") == -1) {
        alert("Masukkan email yang valid.");
        return false;
      }
      if (password.length < 6) {
        alert("Kata sandi harus memiliki minimal 6 karakter.");
        return false;
      }
      alert("Pendaftaran berhasil!");
      return true;
    }
  </script>

  <script src="latihan.js"></script>
</html>
