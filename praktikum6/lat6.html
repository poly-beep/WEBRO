<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="myForm" onsubmit="return validateForm();">
      <label for="name">Nama:</label>
      <input type="text" id="name" onblur="validateName()" /><br /><br />
      <label for="email">Email:</label>
      <input type="email" id="email" onblur="validateEmail()" /><br /><br />
      <label for="age">Umur (Harus angka):</label>
      <input type="number" id="age" onblur="validateAge()" /><br /><br />
      <input type="submit" value="Submit" />
    </form>
  </body>
  <script src="lat6.js"></script>
</html>
